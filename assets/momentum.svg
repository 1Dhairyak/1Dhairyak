<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .e{fill:#6b7497;font-size:11px;letter-spacing:3px} .t{fill:#e8ebf7;font-size:26px}
.m{fill:#6b7497;font-size:12px} .w{fill:#e8ebf7} .a{fill:#8b9bff}
.in{opacity:0;animation:in .9s ease forwards} @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2.4s ease-in-out infinite} @keyframes pulse{50%{opacity:.25}}
.run{animation:run 3s ease-in-out infinite alternate} @keyframes run{to{transform:translateX(200px)}}</style>
<rect x="1" y="1" width="1198" height="348" rx="18" fill="#0b1124" stroke="#1b2442" stroke-width="2"/>
<text x="40" y="52" class="e">PROFILE SIGNAL</text><text x="40" y="94" class="t">Momentum, made visible</text><line x1="40" y1="124" x2="1160" y2="124" stroke="#1b2442" stroke-dasharray="6 6"/><g class="in" style="animation-delay:0.0s"><text x="40" y="200" class="w" font-size="34">26</text><text x="40" y="228" class="e" font-size="10">REPOSITORIES</text><line x1="48" y1="290" x2="250" y2="290" stroke="#1b2442" stroke-dasharray="4 6"/><circle cx="48" cy="290" r="7" class="a run" opacity=".8" style="animation-delay:0.0s"/></g><g class="in" style="animation-delay:0.2s"><text x="325" y="200" class="w" font-size="34">340</text><text x="325" y="228" class="e" font-size="10">CONTRIBUTIONS</text><line x1="333" y1="290" x2="535" y2="290" stroke="#1b2442" stroke-dasharray="4 6"/><circle cx="333" cy="290" r="7" class="a run" opacity=".8" style="animation-delay:0.4s"/></g><g class="in" style="animation-delay:0.4s"><text x="610" y="200" class="w" font-size="34">70</text><text x="610" y="228" class="e" font-size="10">ACTIVE DAYS</text><line x1="618" y1="290" x2="820" y2="290" stroke="#1b2442" stroke-dasharray="4 6"/><circle cx="618" cy="290" r="7" class="a run" opacity=".8" style="animation-delay:0.8s"/></g><g class="in" style="animation-delay:0.6000000000000001s"><text x="895" y="200" class="w" font-size="34">9</text><text x="895" y="228" class="e" font-size="10">LANGUAGES</text><line x1="903" y1="290" x2="1105" y2="290" stroke="#1b2442" stroke-dasharray="4 6"/><circle cx="903" cy="290" r="7" class="a run" opacity=".8" style="animation-delay:1.2000000000000002s"/></g></svg>